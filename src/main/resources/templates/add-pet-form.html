<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm mới Thú cưng</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.5;
        margin: 24px;
      }

      .error {
        color: red;
        font-size: 0.95rem;
      }

      .field {
        margin-bottom: 16px;
      }

      label {
        display: block;
        margin-bottom: 4px;
        font-weight: bold;
      }

      input {
        width: 320px;
        padding: 8px;
        border: 1px solid #999;
        border-radius: 4px;
      }

      button {
        padding: 10px 18px;
        border: none;
        border-radius: 4px;
        background: #007bff;
        color: white;
        cursor: pointer;
      }

      button:hover {
        background: #0056b3;
      }
    </style>
  </head>
  <body>
    <h1>Thêm mới Thú cưng</h1>
    <form th:action="@{/pet/add}" th:object="${pet}" method="post">
      <div class="field">
        <label for="petName">Tên thú cưng</label>
        <input type="text" id="petName" th:field="*{petName}" />
        <span
          class="error"
          th:if="${#fields.hasErrors('petName')}"
          th:errors="*{petName}"
        ></span>
      </div>

      <div class="field">
        <label for="age">Tuổi</label>
        <input type="number" id="age" th:field="*{age}" min="0" />
        <span
          class="error"
          th:if="${#fields.hasErrors('age')}"
          th:errors="*{age}"
        ></span>
      </div>

      <div class="field">
        <label for="petCode">Mã thú cưng</label>
        <input type="text" id="petCode" th:field="*{petCode}" />
        <span
          class="error"
          th:if="${#fields.hasErrors('petCode')}"
          th:errors="*{petCode}"
        ></span>
      </div>

      <button type="submit">Lưu</button>
    </form>
  </body>
</html>
